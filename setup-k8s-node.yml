  tasks:
    - name: Create or Update Credentials and Node in Jenkins via Groovy
      ansible.builtin.uri:
        url: "{{ jenkins_url }}/scriptText"
        method: POST
        user: "{{ jenkins_user }}"
        password: "{{ jenkins_api_token }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          script: |
            import jenkins.model.*
            import hudson.slaves.*
            import hudson.plugins.sshslaves.*
            import com.cloudbees.jenkins.plugins.sshcredentials.impl.*
            import com.cloudbees.plugins.credentials.*
            import com.cloudbees.plugins.credentials.domains.*
            import com.cloudbees.plugins.credentials.impl.*

            def instance = Jenkins.getInstance()

            // 1. Add or Update SSH Private Key Credentials
            def credentialsStore = instance.getExtensionList('com.cloudbees.plugins.credentials.SystemCredentialsProvider')[0].getStore()
            def domain = Domain.global()
            
            def privateKeySource = new BasicSSHUserPrivateKey.DirectEntryPrivateKeySource('''{{ privateKey_content }}''')
            def credentials = new BasicSSHUserPrivateKey(
                CredentialsScope.GLOBAL,
                "{{ credential_id }}",
                "{{ ssh_username }}",
                privateKeySource,
                "",
                "Jenkins K8s SSH Key"
            )
            
            // Check if credential exists, update or add
            def existingCreds = credentialsStore.getCredentials(domain).find { it.id == "{{ credential_id }}" }
            if (existingCreds != null) {
                credentialsStore.updateCredentials(domain, existingCreds, credentials)
            } else {
                credentialsStore.addCredentials(domain, credentials)
            }

            // 2. Create or Update the Dumb Slave (SSH Agent)
            def nodeName = "{{ node_name }}"
            def existingNode = instance.getNode(nodeName)
            if (existingNode != null) {
                instance.removeNode(existingNode)
            }

            // Set up launcher
            ComputerLauncher launcher = new SSHLauncher(
                "{{ host_ip }}",
                22,
                "{{ credential_id }}",
                "", // jvmOptions
                "", // javaPath
                "", // prefixStartAgentCommand
                "", // suffixStartAgentCommand
                60, // launchTimeoutSeconds
                3,  // maxNumRetries
                10, // retryWaitTime
                new com.cloudbees.jenkins.plugins.sshslaves.verifiers.NonVerifyingKeyVerificationStrategy()
            )

            Slave slave = new DumbSlave(
                nodeName,
                "{{ remote_dir }}",
                launcher
            )
            slave.setNumExecutors({{ num_executors }})
            slave.setLabelString("{{ node_labels }}")
            slave.setMode(Node.Mode.NORMAL)
            slave.setRetentionStrategy(new RetentionStrategy.Always())

            instance.addNode(slave)
            println("Successfully created Jenkins agent node: " + nodeName)
        status_code: [200]
