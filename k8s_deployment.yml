apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: app-container
          # Replace with your Docker Hub username, repository, and tag (e.g., nginx:latest)
          image: jyothihelios/webapp-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80 # Replace with the port your container listens on
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
          
      # Optional: Uncomment the lines below ONLY if your Docker Hub repository is private
      # imagePullSecrets:
      #   - name: regcred
