apiVersion: v1
kind: Service
metadata:
  name: my-dockerhub-service
spec:
  selector:
    app: webapp
  # Service Types:
  # - ClusterIP: Internal cluster access only (default)
  # - NodePort: Exposes the service on each Node's IP at a static port (30000-32767)
  # - LoadBalancer: Exposes the service externally using a cloud provider's load balancer
  type: NodePort
  ports:
    - protocol: TCP
      port: 80          # The port the Service exposes externally
      targetPort: 30008  # Must match containerPort in the Deployment above
